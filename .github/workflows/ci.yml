name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run

      # Nota: `npm run lint` está deshabilitado en CI porque el repo aún no
      # tiene configuración de ESLint (el script falla por falta de config,
      # no por el código). Reactivar cuando se agregue eslint.config.js.
