<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: obligatorio para que env(safe-area-inset-*) tenga valor -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- theme-color por esquema: la barra de estado acompaña el tema del sistema -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ventus" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Ventus — CRM de campo da Ventapel Brasil. Metodologia PPVVCC." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- El .ico es para el Windows del escritório y para los lectores de RSS
         viejos que ignoran el SVG; los navegadores modernos usan el de arriba. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Open Graph: el link de /instalar se manda por WhatsApp y por el bot.
         Sin esto llega como texto pelado y parece spam. La URL absoluta es
         obligatoria: WhatsApp no resuelve rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ventus" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Ventus — CRM de campo da Ventapel Brasil" />
    <meta
      property="og:description"
      content="A próxima melhor ação, decidida antes de sair para a rua. Funciona sem sinal."
    />
    <meta property="og:image" content="https://ventus.ventapel.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ventus — CRM de campo da Ventapel Brasil" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Ventus — Ventapel Brasil</title>
    <script>
      // Tema aplicado antes del primer paint para evitar el flash de tema claro.
      // Duplica la lógica de src/app/ThemeProvider.tsx a propósito: tiene que
      // correr sincrónico, antes de que React monte.
      (function () {
        try {
          document.documentElement.classList.remove('no-js')
          var stored = localStorage.getItem('ventus.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* modo privado sin localStorage: se queda con el tema del sistema */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ventus precisa de JavaScript ativado para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
